<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يوم التسامح الدولي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
        }
        h1 {
            color: #007bff;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .content {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #fff;
        }
        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #555;
        }
    </style>
    <script>
        function showContent(section) {
            const sections = {
                definition: `
                    <h2>التسامح لغة واصطلاحًا</h2>
                    <p><strong>لغة:</strong> من المسامحة، وهي المساهلة، والتسامح هو التساهل.</p>
                    <p><strong>اصطلاحًا:</strong> الصفح والعفو والإحسان والقدرة عن العفو عن الآخرين، وعدم مقابلة الإساءة بإساءة مثلها، والذي يقابله التعصب والتطرف والغلو.</p>
                    <p>فالتسامح خلق إسلامي أصيل، رغّب به الشرع وحبب المكلفين فيه وجعله منهاجًا لتعامل المسلم مع إخوانه.</p>
                `,
                king_salman: `
                    <h2>كلمة خادم الحرمين الشريفين الملك سلمان</h2>
                    <p>
                        "إن العلم والمعرفة هما الأساس الذي تقوم عليه نهضة الأمم، من خلال تكوين أجيال متعلمة تقود المجتمعات، 
                        وتساهم في تعزيز التسامح والتعايش بين الشعوب، والمحافظة على المنجزات الحضارية."
                    </p>
                `,
                prince_mohammed: `
                    <h2>كلمة صاحب السمو الملكي الأمير محمد بن سلمان</h2>
                    <p>
                        "سنعود إلى ما كنا عليه، سنعيش حياة طبيعية، نترجم ديننا السمح وعاداتنا الطيبة، ونتعايش مع العالم، 
                        ونساهم في تنمية وطننا."
                    </p>
                `,
                types: `
                    أنواع التسامح:<br>
                    1. التسامح الديني: قبول اختلاف الأديان.<br>
                    2. التسامح العرقي: نبذ العنصرية.<br>
                    3. التسامح الفكري: احترام الآراء المختلفة.
                `,
                quran: `
                    التسامح في القرآن الكريم:<br>
                    قال الله تعالى: "وَإِنْ تَعْفُوا وَتَصْفَحُوا وَتَغْفِرُوا فَإِنَّ اللَّهَ غَفُورٌ رَحِيمٌ" (التغابن: 14).
                `,
                sunnah: `
                   <h2>التسامح في السنة النبوية</h2>
                    <p>أما ما ذكر في السنة عن أحاديث الرسول صلى الله عليه وسلم في التسامح فهي عديدة وكثيرة، من بعض هذه الأحاديث:</p>
                    <ul>
                        <li>يقول رسول الله صلى الله عليه وسلم: "من قتل معاهدًا لم يرح رائحة الجنة، وإن ريحها توجد من مسيرة أربعين عامًا" (رواه البخاري).</li>
                        <li>وقال صلى الله عليه وسلم: "ألا من ظلم معاهدًا، أو انتقصه، أو كلفه فوق طاقته، أو أخذ منه شيئًا بغير طيب نفس، فأنا حجيجه – أي: أنا الذي أخاصمه وأحاجه – يوم القيامة" (رواه أبو داود).</li>
                                      `,
                document: `
                    وثيقة التسامح:<br>
                    أنا أتعهد أن أكون متسامحًا في أقوالي وأفعالي.<br>
                    سأقبل الآخرين كما هم وأحترم اختلافاتهم.<br>
                    سأسعى دائمًا لنشر روح التسامح والسلام في مجتمعي.
                `
            };
            document.getElementById("content").innerHTML = sections[section];
        }
    </script>
</head>
<body>
    <h1>🌍 يوم التسامح الدولي 🌟</h1>
    <p>مدرسة متوسطة لعصان - إعداد: المعلمة مرام سرحان</p>
    <div>
        <button class="button" onclick="showContent('definition')">تعريف التسامح</button>
        <button class="button" onclick="showContent('king_salman')">كلمة خادم الحرمين الشريفين</button>
        <button class="button" onclick="showContent('prince_mohammed')"> كلمة صاحب السمو الملكي محمد بن سلمان</button>
        <button class="button" onclick="showContent('types')">أنواع التسامح</button>
        <button class="button" onclick="showContent('quran')">التسامح في القرآن</button>
        <button class="button" onclick="showContent('sunnah')">التسامح في السنة</button>
        <button class="button" onclick="showContent('document')">وثيقة التسامح</button>
    </div>
    <div id="content" class="content">
        <p>اختر موضوعًا من الأعلى لعرض التفاصيل.</p>
    </div>
    <footer>
       © 2024 مدرسة متوسطة لعصان - إعداد: المعلمة مرام سرحان
        المرجع : https://drive.google.com/drive/folders/1GzAOw1FLoO87YYl2JCyNJ566IVJ_f6s0
    </footer>
</body>
</html>
